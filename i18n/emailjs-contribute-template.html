<!-- Contribute page submissions. EmailJS template "Contribute submissions":
     paste everything below this comment into the template's Content, using the Code Editor.
     Subject: New contribution: {{type}} from {{name}}   To email: drdamolaafrica@gmail.com
     From name: Rethinking Africa website   Reply To: {{email}} (pressing Reply answers the contributor)
     Sent by site/contribute.html. -->
<div style="margin:0;padding:0;background-color:#F7F1E3;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7F1E3" style="background-color:#F7F1E3;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="width:100%;max-width:600px;background-color:#FFFFFF;border:1px solid #E6DFD1;border-radius:16px;overflow:hidden;">
        <tr>
          <td bgcolor="#1D2A57" style="background-color:#1D2A57;padding:22px 28px;font-family:Georgia,'Times New Roman',serif;color:#F7F1E3;">
            <p style="margin:0 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#E8A11C;">New contribution from the website</p>
            <p style="margin:0;font-size:24px;line-height:1.3;font-weight:bold;">{{type}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 28px 8px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#2A3350;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td style="padding:6px 0;width:130px;color:#865B0A;font-weight:bold;vertical-align:top;">Name</td><td style="padding:6px 0;">{{name}}</td></tr>
              <tr><td style="padding:6px 0;color:#865B0A;font-weight:bold;vertical-align:top;">Email</td><td style="padding:6px 0;"><a href="mailto:{{email}}" style="color:#1D2A57;">{{email}}</a></td></tr>
              <tr><td style="padding:6px 0;color:#865B0A;font-weight:bold;vertical-align:top;">WhatsApp</td><td style="padding:6px 0;">{{whatsapp}}</td></tr>
              <tr><td style="padding:6px 0;color:#865B0A;font-weight:bold;vertical-align:top;">Country</td><td style="padding:6px 0;">{{country}}</td></tr>
              <tr><td style="padding:6px 0;color:#865B0A;font-weight:bold;vertical-align:top;">Site language</td><td style="padding:6px 0;">{{language}}</td></tr>
            </table>
            <p style="margin:20px 0 8px;font-weight:bold;color:#865B0A;">Their story, proposal or message</p>
            <div style="padding:16px 18px;background-color:#F7F1E3;border-radius:10px;font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.65;color:#2A3350;white-space:pre-wrap;">{{message}}</div>
            <p style="margin:20px 0 24px;font-size:13px;color:#5A6280;">Press Reply to answer {{name}} directly.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</div>
