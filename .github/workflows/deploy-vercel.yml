# Publishes the site/ folder to Vercel every time main changes on GitHub.
# Vercel project: rethinking-africa-with-dr-damola
# Needs one repository secret: VERCEL_TOKEN (Settings > Secrets and variables > Actions).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_1FYh4ZPHfxE0qXqonaaz0OjY
      VERCEL_PROJECT_ID: prj_E97ILoT748uPik2hyK0pVG4AKLtE
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy site/ to production
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
